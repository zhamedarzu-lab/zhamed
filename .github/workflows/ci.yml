name: CI

# Replit's agent pushes to main many times a day. This is the net that catches
# a broken push at the time it lands rather than at the next session.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        # Without this the job can start querying before Postgres accepts
        # connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tracker_test
      # Both vite configs read these at load time and throw without them, so
      # the build cannot run unset — Replit supplies them, CI has to too.
      PORT: 5173
      BASE_PATH: /

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The migrations in lib/db/migrations are incremental patches against an
      # existing database, not a from-zero series, so a fresh CI database is
      # built from the Drizzle schema instead.
      - name: Create test schema
        run: pnpm --filter @workspace/db run push

      - name: Test
        run: pnpm --filter @workspace/api-server run test

      - name: Build
        run: pnpm -r --if-present run build
